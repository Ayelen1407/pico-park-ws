#Ayelen Quispe
name: CI/CD Pico Park

on:
  push:
    branches:
      - main

jobs:
  construir-imagen:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Iniciar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: servidor/Dockerfile
          push: true
          tags: bel3n/picopark-server:v1.0

  desplegar-vm:
    needs: construir-imagen
    runs-on: self-hosted
    steps:
      - name: Descargar codigo actualizado
        uses: actions/checkout@v4

      - name: Actualizar y desplegar contenedores
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
