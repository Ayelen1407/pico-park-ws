global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'node-exporter-ayelen'
    static_configs:
      - targets: ['node-exporter-ayelen:9100']

  - job_name: 'cadvisor-ayelen'
    static_configs:
      - targets: ['cadvisor-ayelen:8080']

  - job_name: 'picopark-server-ayelen'
    static_configs:
      - targets: ['picopark-servidor-ayelen:3000']
