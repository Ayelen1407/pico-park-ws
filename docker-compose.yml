name: picopark-ayelen

services:
  picopark-server:
    image: bel3n/picopark-server:v1.0
    build:
      context: .
      dockerfile: servidor/Dockerfile
    container_name: picopark-servidor-ayelen
    ports:
      - "3002:3000"
    environment:
      - HOST_PUBLICO=10.56.31.30
      - PUERTO_PUBLICO=3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) process.exit(1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
