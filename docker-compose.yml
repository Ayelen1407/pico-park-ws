name: picopark-ayelen

services:
  picopark-server:
    image: bel3n/picopark-server:v1.0
    build:
      context: .
      dockerfile: servidor/Dockerfile
    container_name: picopark-servidor-ayelen
    ports:
      - "3002:3000"
    environment:
      - HOST_PUBLICO=10.56.31.30
      - PUERTO_PUBLICO=3002
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ip').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
